<!doctype html>
<html lang="zh-cmn-Hans">
  <include src="partials/head-zh.html" locals='{"title":"社区 - "}'></include>
  <body>
    <div class="tac-blobs" aria-hidden="true">
      <div class="tac-blobs__item tac-blobs__item--1"></div>
      <div class="tac-blobs__item tac-blobs__item--2"></div>
      <div class="tac-blobs__item tac-blobs__item--3"></div>
    </div>

    <include src="partials/header-zh.html"></include>

    <main>
      <div class="tac__inner">
        <header class="tac-page-head">
          <h1 class="tac-page-head__title tac-jelly">社区</h1>
          <p class="tac-page-head__desc">和小伙伴们一起按压、分享、交流——每一次互动都有弹性回响</p>
        </header>

        <div class="tac-community">
          <article class="tac-community-card tac-squish">
            <img src="https://b3log.org/images/brand/hacpai-128.png" alt="链滴" />
            <h2 class="tac-community-card__title">链滴</h2>
            <div class="tac-community-card__links">
              <a class="tac-community-card__link tac-squish" href="https://ld246.com/tag/siyuan" target="_blank">用户论坛</a>
            </div>
          </article>

          <article class="tac-community-card tac-squish">
            <img src="@@STATIC@@/logo-github.png" alt="GitHub" />
            <h2 class="tac-community-card__title">GitHub</h2>
            <div class="tac-community-card__links">
              <a class="tac-community-card__link tac-squish" href="https://github.com/siyuan-note/siyuan" target="_blank" rel="nofollow">思源仓库</a>
              <a class="tac-community-card__link tac-squish" href="https://github.com/siyuan-note/bazaar" target="_blank" rel="nofollow">集市仓库</a>
              <a class="tac-community-card__link tac-squish" href="https://github.com/orgs/siyuan-note/projects/1" target="_blank" rel="nofollow">路线图</a>
            </div>
          </article>

          <article class="tac-community-card tac-squish">
            <img src="@@STATIC@@/logo-weibo.png" alt="微博" />
            <h2 class="tac-community-card__title">微博</h2>
            <div class="tac-community-card__links">
              <a class="tac-community-card__link tac-squish" href="https://weibo.com/u/2778228501" target="_blank" rel="nofollow">B3log 开源社区</a>
            </div>
          </article>

          <article class="tac-community-card tac-squish">
            <img src="@@STATIC@@/logo-twitter.png" alt="Twitter" />
            <h2 class="tac-community-card__title">Twitter</h2>
            <div class="tac-community-card__links">
              <a class="tac-community-card__link tac-squish" href="https://twitter.com/b3logos" target="_blank" rel="nofollow">@b3logos</a>
            </div>
          </article>

          <article class="tac-community-card tac-squish">
            <img src="@@STATIC@@/logo-qq.png" alt="QQ" />
            <h2 class="tac-community-card__title">QQ 群</h2>
            <div class="tac-community-card__links">
              <a class="tac-community-card__link tac-squish" href="https://jq.qq.com/?_wv=1027&k=O5Ws3eQQ" target="_blank">加入交流群</a>
            </div>
          </article>

          <article class="tac-community-card tac-squish">
            <img src="@@STATIC@@/logo-discord.png" alt="Discord" />
            <h2 class="tac-community-card__title">Discord</h2>
            <div class="tac-community-card__links">
              <a class="tac-community-card__link tac-squish" href="https://discord.gg/dmD7prvbnA" target="_blank" rel="nofollow">加入 Discord</a>
            </div>
          </article>
        </div>
      </div>

    <include src="partials/footer-zh.html"></include>
    <include src="partials/site-script.html"></include>
