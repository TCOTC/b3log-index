<!doctype html>
<html lang="zh-cmn-Hans">
  <include src="partials/head-zh.html" locals='{"title":"社区 - "}'></include>
  <body>
    <div class="sk-binding" aria-hidden="true"></div>

    <include src="partials/header-zh.html"></include>

    <main>
      <div class="sk-page">
        <div class="sk-paper">
          <header class="sk-page-head">
            <h1 class="sk-page-head__title">社区</h1>
            <p class="sk-page-head__desc">和书友们一起书写笔记、分享心得、交流灵感</p>
          </header>

          <div class="sk-community">
            <article class="sk-community-card">
              <img src="https://b3log.org/images/brand/hacpai-128.png" alt="链滴" />
              <h2 class="sk-community-card__title">链滴</h2>
              <div class="sk-community-card__links">
                <a class="sk-community-card__link" href="https://ld246.com/tag/siyuan" target="_blank">用户论坛</a>
              </div>
            </article>

            <article class="sk-community-card">
              <img src="@@STATIC@@/logo-github.png" alt="GitHub" />
              <h2 class="sk-community-card__title">GitHub</h2>
              <div class="sk-community-card__links">
                <a class="sk-community-card__link" href="https://github.com/siyuan-note/siyuan" target="_blank" rel="nofollow">思源仓库</a>
                <a class="sk-community-card__link" href="https://github.com/siyuan-note/bazaar" target="_blank" rel="nofollow">集市仓库</a>
                <a class="sk-community-card__link" href="https://github.com/orgs/siyuan-note/projects/1" target="_blank" rel="nofollow">路线图</a>
              </div>
            </article>

            <article class="sk-community-card">
              <img src="@@STATIC@@/logo-weibo.png" alt="微博" />
              <h2 class="sk-community-card__title">微博</h2>
              <div class="sk-community-card__links">
                <a class="sk-community-card__link" href="https://weibo.com/u/2778228501" target="_blank" rel="nofollow">B3log 开源社区</a>
              </div>
            </article>

            <article class="sk-community-card">
              <img src="@@STATIC@@/logo-twitter.png" alt="Twitter" />
              <h2 class="sk-community-card__title">Twitter</h2>
              <div class="sk-community-card__links">
                <a class="sk-community-card__link" href="https://twitter.com/b3logos" target="_blank" rel="nofollow">@b3logos</a>
              </div>
            </article>

            <article class="sk-community-card">
              <img src="@@STATIC@@/logo-qq.png" alt="QQ" />
              <h2 class="sk-community-card__title">QQ 群</h2>
              <div class="sk-community-card__links">
                <a class="sk-community-card__link" href="https://jq.qq.com/?_wv=1027&k=O5Ws3eQQ" target="_blank">加入交流群</a>
              </div>
            </article>

            <article class="sk-community-card">
              <img src="@@STATIC@@/logo-discord.png" alt="Discord" />
              <h2 class="sk-community-card__title">Discord</h2>
              <div class="sk-community-card__links">
                <a class="sk-community-card__link" href="https://discord.gg/dmD7prvbnA" target="_blank" rel="nofollow">加入 Discord</a>
              </div>
            </article>
          </div>
        </div>
      </div>
    </main>

    <include src="partials/footer-zh.html"></include>
    <include src="partials/site-script.html"></include>
  </body>
</html>
