<!doctype html>
<html lang="zh-cmn-Hans">

      <section class="oled-page">
        <div class="oled__inner">
          <h1 class="oled-page__title">下载思源笔记</h1>
          <p class="oled-page__desc">
            在纯黑界面中开始你的暗夜写作之旅。选择对应平台，一键安装 @@SIYUAN_VERSION_V@@。
          </p>

          <div class="oled-download" id="download">

              data-os="macOS">
              英特尔芯片
              <span>升级需重新下载</span>
            </a>
            <a
              class="oled-download__item"
              style="display: none"
              target="_blank"
              rel="nofollow"
              href="@@RELEASE_CDN@@/siyuan-@@SIYUAN_VERSION@@-mac-arm64.dmg"
              data-os="macOS">
              苹果芯片
              <span>升级需重新下载</span>
            </a>
            <a
              class="oled-download__item"
              target="_blank"
              rel="nofollow"
              href="@@RELEASE_CDN@@/siyuan-@@SIYUAN_VERSION@@-win.exe"
              data-os="Windows">
              Windows x86_64
              <span>升级需重新下载</span>
            </a>
            <a class="oled-download__item" target="_blank" href="https://apps.microsoft.com/detail/9p7hpmxp73k4" data-os="Windows">

              <span>支持一键升级</span>
            </a>
            <a
              class="oled-download__item"
              style="display: none"
              target="_blank"

              <span>升级需重新下载</span>
            </a>
            <a

              style="display: none"

              Linux AppImage
              <span>升级需重新下载</span>
            </a>
            <a
              class="oled-download__item"
              style="display: none"
              target="_blank"
              rel="nofollow"
              href="@@RELEASE_CDN@@/siyuan-@@SIYUAN_VERSION@@-linux.deb"

            <a class="oled-download__item" target="_blank" rel="nofollow" href="@@GITHUB_RELEASE@@">
              GitHub Release
              <span>全部平台</span>
            </a>

            // 安装后可在设置中切换深色主题，获得最佳 OLED 护眼体验
          </p>
