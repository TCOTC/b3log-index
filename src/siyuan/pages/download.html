<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <include src="partials/head-zh.html"></include>
    <title>下载 — 思源笔记</title>
  </head>
  <body class="h3d-page">
    <include src="partials/header-zh.html"></include>

    <section class="h3d-page-hero">
      <h1 class="h3d-page-hero__title">部署你的本地知识空间</h1>
      <p class="h3d-page-hero__desc">选择平台，一键下载 @@SIYUAN_VERSION_V@@。安装完成后，你的知识宇宙将从第一块开始构建。</p>
    </section>

    <section class="h3d-section" style="padding-top: 0">
      <div class="h3d-section__inner">
        <div id="h3d-download" class="h3d-download-grid h3d-scene">
          <article class="h3d-card h3d-download-card h3d-reveal" data-tilt data-os="Windows">
            <span class="h3d-card__glow h3d-card__glow--cyan"></span>
            <div class="h3d-card__body">
              <span class="h3d-download-card__os">🪟</span>
              <h2 class="h3d-download-card__name">Windows</h2>
              <p class="h3d-download-card__arch">64 位 · 安装版</p>
              <a class="h3d-btn h3d-btn--primary" href="@@GITHUB_RELEASE@@/siyuan-@@SIYUAN_VERSION@@-win.exe">下载 .exe</a>
            </div>
          </article>
          <article class="h3d-card h3d-download-card h3d-reveal" data-tilt data-os="macOS">
            <span class="h3d-card__glow h3d-card__glow--violet"></span>
            <div class="h3d-card__body">
              <span class="h3d-download-card__os">🍎</span>
              <h2 class="h3d-download-card__name">macOS</h2>
              <p class="h3d-download-card__arch">Apple Silicon &amp; Intel</p>
              <a class="h3d-btn h3d-btn--primary" href="@@GITHUB_RELEASE@@/siyuan-@@SIYUAN_VERSION@@-mac.dmg">下载 .dmg</a>
            </div>
          </article>
          <article class="h3d-card h3d-download-card h3d-reveal" data-tilt data-os="Linux">
            <span class="h3d-card__glow h3d-card__glow--cyan"></span>
            <div class="h3d-card__body">
              <span class="h3d-download-card__os">🐧</span>
              <h2 class="h3d-download-card__name">Linux</h2>
              <p class="h3d-download-card__arch">AppImage · 免安装</p>
              <a class="h3d-btn h3d-btn--primary" href="@@GITHUB_RELEASE@@/siyuan-@@SIYUAN_VERSION@@-linux.AppImage">下载 AppImage</a>
            </div>
          </article>
          <article class="h3d-card h3d-download-card h3d-reveal" data-tilt data-os="Android">
            <span class="h3d-card__glow h3d-card__glow--violet"></span>
            <div class="h3d-card__body">
              <span class="h3d-download-card__os">📱</span>
              <h2 class="h3d-download-card__name">Android</h2>
              <p class="h3d-download-card__arch">移动端 · 随身探索</p>
              <a class="h3d-btn h3d-btn--primary" href="@@GITHUB_RELEASE@@/siyuan-@@SIYUAN_VERSION@@.apk">下载 .apk</a>
            </div>
          </article>
        </div>

        <div class="h3d-cta h3d-reveal" style="margin-top: 60px">
          <h2 class="h3d-cta__title">更多下载渠道</h2>
          <p class="h3d-cta__desc">
            完整版本列表请访问
            <a href="https://github.com/siyuan-note/siyuan/releases" target="_blank" rel="noopener">GitHub Releases</a>
            或
            <a href="@@RELEASE_CDN@@" target="_blank" rel="noopener">Release CDN</a>。
          </p>
        </div>
      </div>
    </section>

    <include src="partials/footer-zh.html"></include>
    <include src="partials/site-script.html"></include>
  </body>
</html>
